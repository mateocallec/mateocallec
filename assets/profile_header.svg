<svg xmlns="http://www.w3.org/2000/svg" width="920" height="244" viewBox="0 0 920 244" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" role="img" aria-label="Fenetre de profil : Mateo Florian Callec - Bug Bounty, Pentester, Security Researcher, Quantum Computing, AI">
  <defs>
    <clipPath id="screen3"><rect x="0" y="0" width="920" height="244" rx="8"/></clipPath>
    <linearGradient id="scan3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1793d1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1793d1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1793d1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divider3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1793d1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1793d1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1793d1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#screen3)">
    <rect x="0" y="0" width="920" height="244" fill="#0a0e14"/>

    <rect x="0" y="44" width="920" height="70" fill="url(#scan3)">
      <animate attributeName="y" from="-26" to="244" dur="3.2s" repeatCount="indefinite"/>
    </rect>

    <text x="460" y="136" text-anchor="middle" font-family="'Poppins','Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="600" letter-spacing="1" fill="#e6edf3" textLength="400" lengthAdjust="spacingAndGlyphs">Matéo Florian Callec</text>
    <text x="670" y="136" font-family="'Poppins','Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="600" fill="#56c2ff">_<animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/></text>

    <rect x="260" y="158" width="400" height="2" fill="url(#divider3)"/>

    <text y="204" font-family="'Poppins','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" letter-spacing="1.5" fill="#8b949e">
      <tspan x="40" text-anchor="start">BUG BOUNTY</tspan>
      <tspan x="205" text-anchor="start">PENTESTER</tspan>
      <tspan x="360" text-anchor="start">SECURITY RESEARCHER</tspan>
      <tspan x="620" text-anchor="start">QUANTUM COMPUTING</tspan>
      <tspan x="858" text-anchor="start">AI</tspan>
    </text>

    <rect x="0" y="0" width="920" height="44" fill="#12161f"/>
    <text x="20" y="27" fill="#9aa4b2" font-size="13">mateo@callec.net: ~/about — zsh</text>
    <rect x="836" y="16" width="12" height="12" rx="2" fill="#3a3f4b"/>
    <rect x="860" y="16" width="12" height="12" rx="2" fill="#3a3f4b"/>
    <rect x="884" y="16" width="12" height="12" rx="2" fill="#e5534b"/>
    <line x1="0" y1="44" x2="920" y2="44" stroke="#1793d1" stroke-width="1" stroke-opacity="0.4"/>

    <rect x="0" y="0" width="920" height="244" rx="8" fill="none" stroke="#1793d1" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>
</svg>
